apiVersion: v1
kind: Service
metadata:
  name: {{ include "authsvc.fullname" . }}
  labels:
    {{- include "authsvc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 80
      targetPort: {{ .Values.service.httpport }}
      protocol: TCP
      name: http
    - port: 81
      targetPort: {{ .Values.service.grpcport }}
      protocol: TCP
      name: grpc
  selector:
    {{- include "authsvc.selectorLabels" . | nindent 4 }}
