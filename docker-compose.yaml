version: '3'

volumes:
  postgres_data:
    driver: local

networks:
  local:
    driver: bridge

services:
  postgres:
    image: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    networks:
      - local
    ports:
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:legacy
    environment:
      DB_VENDOR: POSTGRES
      DB_ADDR: postgres
      DB_DATABASE: keycloak
      DB_USER: keycloak
      DB_SCHEMA: public
      DB_PASSWORD: password
      KEYCLOAK_USER: admin
      KEYCLOAK_PASSWORD: password
    ports:
      - "8180:8080"
    networks:
      - local
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - local

  gubernator:
    image: ghcr.io/gubernator-io/gubernator:latest
    environment:
      GUBER_HTTP_ADDRESS: 0.0.0.0:8080
      GUBER_GRPC_ADDRESS: 0.0.0.0:8081
    ports:
      - "9080:8080"
    networks:
      - local

  authsvc:
    build: .
    ports:
      - "8080:8080"
      - "8090:8090"
      - "9090:9090"
    environment:
      KEYCLOAK_URL: http://keycloak:8080/
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      GUBERNATOR_URL: http://gubernator:8080/v1/GetRateLimits
    networks:
      - local
    depends_on:
      - keycloak
      - redis
      - gubernator
